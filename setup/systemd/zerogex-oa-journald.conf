# ZeroGEX journald cap.
#
# Installed to /etc/systemd/journald.conf.d/10-zerogex-oa.conf as a drop-in by
# deploy/steps/100.systemd (leaves the distro's /etc/systemd/journald.conf
# untouched).  Apply after copying with:  sudo systemctl restart systemd-journald
#
# Rationale: the root volume is small and runs hot (~90% full).  The nightly
# zerogex-oa-logs-clear job vacuums the journal to 100M once a day, but between
# runs journald's defaults (SystemMaxUse ~ 10% of the fs; individual files up to
# ~1/8 of that) let /var/log/journal balloon — we've observed 250M+ of archived
# journals, including single 106M user journals.  These caps keep it bounded
# 24/7 so the journal can't be what tips the disk over between cleanups.
#
# Two knobs, and BOTH bind: journald stops at whichever of SystemMaxUse and
# SystemKeepFree is tighter.  Tuning the cap alone is what made the previous
# bump a no-op.  `make journal-volume` reports which one is actually in force.
[Journal]
# Hard ceiling on the persistent journal (/var/log/journal), enforced
# continuously by journald as it writes rather than only once a night.
#
# THIS VALUE IS THE SINGLE SOURCE OF TRUTH for the cap: the nightly
# `make logs-clear-noconfirm` reads SystemMaxUse out of the installed copy of
# this file and vacuums to the same number.  (They used to be two independent
# 100M literals, so raising this one silently did nothing — the next nightly
# run vacuumed the journal straight back down to 100M.)
#
# Raised 100M -> 300M after the 2026-08-17 QQQ ingestion outage.  At 100M,
# shared across zerogex-oa-{ingestion,analytics,signals,api}, the journal
# retained only MINUTES of history: by the time the outage was noticed the
# next morning, the evening's logs — including whatever killed the QQQ worker
# — had already been overwritten, so the post-mortem could establish that the
# worker died but never why.  Retention is not a nicety here; it is the
# difference between a root cause and an inference.
#
# Raised 300M -> 2G on 2026-09-03, after finding that every number in the
# paragraph this replaces belonged to the wrong filesystem.
#
# The journal lives in /var/log/journal, and /var/log is its OWN volume
# (deploy/steps/015.data_volume) -- not /.  The previous rationale, and the
# `make journal-volume` output that produced it, both sized headroom against /:
#
#     measured against /          6.8G total,   683M free,  91% full
#     measured against /var/log    10G total,   6.1G free,  39% full
#
# So "there is nowhere to raise it to" was simply wrong.  There are ~4G of
# usable slack above the 15% KeepFree floor (~1.5G of the 10G volume), and that
# floor is nowhere near binding -- the earlier reading that it nearly was came
# from comparing the ROOT volume's free space to the ROOT volume's floor, on a
# volume the journal does not sit on.  `make journal-volume` was corrected in
# the same commit; trust its output over this comment.
#
# 2G at the measured burn rate (~127 MB/h, dominated by the API's per-request
# audit line) buys roughly 16 hours -- against the 2 hours that were left on
# 2026-09-02, when an unattended client generated 384k audit records in one
# evening and evicted everything behind it.  That incident is the argument for
# retention: the extraction destroyed the only record of itself, and what
# survives of it survives because the journal was copied out by hand with about
# an hour to spare.
#
# 16 hours is still short of the days a post-mortem or a licensing question
# needs, and the cap cannot get there -- days at this rate is tens of GB.  The
# next step is NOT a bigger number here.  It is routing src.api.audit to its
# own rotated, compressed file (~150 MB/day gzipped, which does fit) and
# shipping it off-box.  Until that exists, this buys a working day.
SystemMaxUse=2G

# Cap individual journal files so no single unit/user journal grows huge (the
# 106M files noted above).  journald derives 1/8 of SystemMaxUse when this is
# unset -- which was ~37M at the old 300M cap and would now be ~256M, coarse
# enough that one deletion could take a big slice of history.  Held at 50M,
# so a 2G journal rotates across ~40 files and still forces frequent rotation
# — rotation granularity is what journald deletes in, so keeping files well
# under the total cap avoids losing a large slice of history at once.
SystemMaxFileSize=50M
